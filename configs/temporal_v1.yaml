# Temporal predictability experiment, version temporal_v1.
# Cutoffs, grids, and candidate lists below were fixed before the validation
# scores were computed. They are measurement choices, not a fitted hypothesis.
# See docs/EXPERIMENT_PROTOCOL.md and docs/HYPOTHESIS_DECISION_WORKSHEET.md.

experiment_id: temporal_v1
fixation_path: data/raw/COCOFreeView_fixations_trainval.json
output_dir: outputs/temporal_v1

canvas:
  width_px: 1680
  height_px: 1050

grid:
  nx: 42
  ny: 26
  # Equal-area bins via linspace edges. 1680/42 and 1050/26 are the bin sizes.
  robustness_grids:
    - [21, 13]
    - [84, 52]

models:
  # Geometric reference only. Not a model of looking.
  uniform_name: B0_uniform
  sigma_candidates_px: [24, 40, 64, 96, 128]
  # Mixture with the discrete uniform. Keeps every bin probability positive.
  # Primary value was not chosen by maximizing a validation score.
  alpha_primary: 0.05
  alpha_sensitivity: [0.01, 0.10]
  lambda_candidates: [0.0, 0.25, 0.5, 0.75, 1.0]

splits:
  # crc32(image_name) % modulus, applied to train images only.
  # bucket 0 selects bandwidths, bucket 1 selects mixture weights,
  # remaining buckets fit densities. Validation images are never assigned a role.
  role_modulus: 5
  bandwidth_bucket: 0
  mixture_bucket: 1
  train_split_name: train
  eval_split_name: valid

temporal:
  # Primary targets are released indices >= primary_index_min.
  # Index 0 stays available as history for index 1.
  primary_index_min: 1
  early_start: 1
  early_end: 3
  middle_start: 4
  middle_end: 8
  late_start: 9
  # A scanpath is in the balanced subset when indices 0 through 11 all exist,
  # so indices 1-3 and at least three late indices (9, 10, 11) are observed.
  balanced_min_length: 12
  index_curve_max: 15

uncertainty:
  n_bootstrap: 2000
  bootstrap_seed: 20261114
  shuffle_seed: 20261114

atlas:
  # Applied to validation images after scores exist. Quartiles are within
  # that validation image set. This file fixes the rule before inspection.
  n_examples: 3
  high_quantile: 0.75
  low_quantile: 0.25
  min_observers: 8
