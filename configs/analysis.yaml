# HumanGazeLab analysis configuration.
# Values under analysis.early_* , center_radii, and seeds are analyst choices.
# They are recorded in docs/ASSUMPTIONS.md. They were not fit to a result.

dataset:
  fixation_url: "http://vision.cs.stonybrook.edu/~cvlab_download/COCOFreeView_fixations_trainval.json"
  readme_url: "https://drive.google.com/uc?export=download&id=1Hj_jyK8Ml27Ge_5sogEtyI7XOjyad4aj"
  readme_page: "https://drive.google.com/file/d/1Hj_jyK8Ml27Ge_5sogEtyI7XOjyad4aj/view?usp=sharing"
  test_probe_url: "http://vision.cs.stonybrook.edu/~cvlab_download/COCOFreeView_fixations_test.json"
  project_page: "https://sites.google.com/view/cocosearch/coco-freeview"
  stimulus_page: "https://sites.google.com/view/cocosearch/home"
  tp_zip_url: "http://vision.cs.stonybrook.edu/~cvlab_download/COCOSearch18-images-TP.zip"
  ta_zip_url: "http://vision.cs.stonybrook.edu/~cvlab_download/COCOSearch18-images-TA.zip"
  fixation_path: data/raw/COCOFreeView_fixations_trainval.json
  readme_path: data/raw/COCOFreeView_readme.txt
  image_dir: data/raw/images_subset

canvas:
  width_px: 1680
  height_px: 1050
  source: "COCO-FreeView readme v1.0 (06/2022) states that images were resized to 1680x1050 with zero padding and the aspect ratio kept."

analysis:
  # Primary spatial summaries drop fixation index 0. The readme says the released
  # sequences include the initial center fixation. The including-index-0 summaries
  # are still computed and labeled.
  drop_initial_fixation: true
  early_k_primary: 3
  early_k_sensitivity: [1, 2, 5]
  center_radius_primary_px: 200
  center_radii_px: [100, 200, 400]
  # Temporal onset is the sum of released durations of earlier fixations.
  # Saccade time is not in the file. See docs/ASSUMPTIONS.md.
  early_time_primary_ms: 1500
  early_time_sensitivity_ms: [1000, 2000]
  n_shuffles: 20
  shuffle_seed: 20261114
  n_bootstrap: 2000
  bootstrap_seed: 20261114
  uniform_mc_n: 200000
  uniform_mc_seed: 20261114
  density_bins_x: 42
  density_bins_y: 26

images:
  n_train: 12
  n_valid: 6
  seed: 20261114
  min_subjects: 10
  prefer_archive: TP

output_dir: outputs
